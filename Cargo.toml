[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/Langmans/saywut"

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# sherpa-rs-sys's build script links the debug C runtime (msvcrtd) whenever it
# was itself compiled with debug assertions, which every dev build script is.
# Next to whisper.cpp and Rust on the release runtime (msvcrt) that gives two
# C runtimes in one process, and a file opened in one and read in the other
# trips a CRT assertion. Build scripts never need debug assertions.
[profile.dev.build-override]
debug-assertions = false
