name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Where tests and `saywut models fetch` find the real models.
      SAYWUT_MODEL_DIR: ${{ github.workspace }}/models
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # whisper-rs-sys generates bindings with libclang; the runner image has
      # LLVM installed but does not point to it.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=C:\Program Files\LLVM\bin"
      # Model files keyed by the manifest: only a changed manifest downloads.
      - uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('models.toml') }}
      # sherpa-rs-sys copies its DLLs into target/<profile>/deps, which cargo's
      # build-dir layout no longer creates (see crates/diarize-sherpa).
      - run: mkdir -p target/debug/deps target/llvm-cov-target/debug/deps
        shell: bash
      - run: |
          for id in whisper-base pyannote-segmentation-3 campplus-voxceleb; do
            cargo run --quiet -p saywut-cli -- models fetch "$id"
          done
        shell: bash
      # Tauri (saywut-app) links WebKitGTK on Linux; Windows and macOS ship
      # their webview with the OS.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo llvm-cov --workspace --fail-under-lines 100

  # The Vue frontend of saywut-app. It runs in a browser engine, not on the
  # OS directly, so one platform is enough.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/saywut-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/saywut-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
