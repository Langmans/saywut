[package]
name = "saywut-diarize-sherpa"
description = "Speaker diarization and voice embeddings for Saywut via sherpa-onnx."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
saywut-core = { path = "../saywut-core" }
# download-binaries fetches prebuilt shared sherpa-onnx and onnxruntime
# libraries from sherpa-onnx's GitHub releases at build time; tts is unused.
# Its build script copies the DLLs into target/<profile>/deps, which cargo's
# build-dir layout does not create: that folder must exist (see README).
# Not static: that build lacks advapi32 and brings a /MT runtime next to /MD.
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }

[dev-dependencies]
saywut-capture-file = { path = "../capture-file" }
saywut-models = { path = "../saywut-models" }

[lints]
workspace = true
